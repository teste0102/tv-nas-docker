# =============================================================================
# Frigate — configuração
# Docs: https://docs.frigate.video/configuration/
#
# COMO PREENCHER SUAS CÂMERAS:
#   1. Descubra o link RTSP de cada câmera (veja o README.md).
#   2. Copie o bloco de "camera_frente" pra cada câmera, mudando o nome e o path.
#   3. A senha vem do arquivo .env — use {FRIGATE_RTSP_PASSWORD} no lugar da senha.
#      Assim a senha não fica escrita aqui (nem vai pro git).
# =============================================================================

mqtt:
  enabled: false   # ligue depois se for integrar com Home Assistant

# -----------------------------------------------------------------------------
# DETECÇÃO — na CPU (não usa a GPU de 16GB, que fica livre pras suas outras IAs)
# Se um dia comprar um Google Coral, troque este bloco por:
#   detectors:
#     coral:
#       type: edgetpu
#       device: usb
# -----------------------------------------------------------------------------
detectors:
  cpu1:
    type: cpu
    num_threads: 3

ffmpeg:
  # DECODIFICAÇÃO na CPU por padrão (não toca na GPU).
  # Pra usar a GPU Nvidia só pra decodificar vídeo, descomente a linha abaixo
  # E descomente o bloco "deploy" no docker-compose.yml:
  # hwaccel_args: preset-nvidia
  output_args:
    record: preset-record-generic-audio-copy

# -----------------------------------------------------------------------------
# go2rtc — reencaminha o stream da câmera (evita abrir 2 conexões na câmera:
# uma pra detecção e outra pra gravação). Recomendado.
# -----------------------------------------------------------------------------
go2rtc:
  streams:
    camera_frente:
      # >>> AJUSTE: usuário, IP e caminho do stream da SUA câmera <<<
      # A senha vem do .env — mantenha o {FRIGATE_RTSP_PASSWORD}
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.15.101:554/cam/realmonitor?channel=1&subtype=0"

# -----------------------------------------------------------------------------
# Padrões aplicados a TODAS as câmeras (pode sobrescrever por câmera)
# -----------------------------------------------------------------------------
record:
  enabled: true
  retain:
    days: 3          # gravação contínua: 3 dias (aumenta/diminui conforme o NAS)
    mode: motion     # só guarda trechos com movimento (economiza MUITO espaço)
  events:
    retain:
      default: 14    # clipes de eventos (pessoa, carro...): 14 dias
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

objects:
  track:
    - person
    - car

# -----------------------------------------------------------------------------
# CÂMERAS
# -----------------------------------------------------------------------------
cameras:
  camera_frente:                 # nome da câmera (troque à vontade, sem espaços/acentos)
    enabled: true
    ffmpeg:
      inputs:
        # Puxa do restream do go2rtc (definido acima) — não repete a senha aqui
        - path: rtsp://127.0.0.1:8554/camera_frente
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280    # ajuste pra resolução do substream da câmera
      height: 720
      fps: 5         # 5 fps é suficiente pra detecção (menos CPU)

  # ---- Modelo pra COPIAR pra próxima câmera (descomente e ajuste) ----
  # camera_fundos:
  #   enabled: true
  #   ffmpeg:
  #     inputs:
  #       - path: rtsp://127.0.0.1:8554/camera_fundos
  #         input_args: preset-rtsp-restream
  #         roles:
  #           - detect
  #           - record
  #   detect:
  #     width: 1280
  #     height: 720
  #     fps: 5
  #
  # (e adicione o stream correspondente em go2rtc: -> streams: -> camera_fundos:)

# Versão do formato de config (não mexa):
version: 0.14
