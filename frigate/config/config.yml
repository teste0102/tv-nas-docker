# =============================================================================
# Frigate — configuração
# Docs: https://docs.frigate.video/configuration/
#
# CÂMERAS CARECAM (HMT): o link RTSP é /streamtype=0 (principal) e
# /streamtype=1 (sub), usuário admin sem senha. Esse caminho foi descoberto
# via ONVIF (porta 8899) — não dá pra adivinhar. Pra achar o de uma câmera
# nova, veja o passo a passo no README.md ("Descobrir o RTSP via ONVIF").
# =============================================================================

mqtt:
  enabled: true
  host: mosquitto   # broker na rede Docker "cameras"
  port: 1883

# -----------------------------------------------------------------------------
# DETECÇÃO NA GPU (Nvidia RTX 5060 Ti) — detector ONNX (usa TensorRT na placa).
# A análise cai de ~140ms (CPU) pra ~5-10ms. A GPU é compartilhada com o
# Assistente/ComfyUI (VRAM do modelo ~1-2 GB).
# -----------------------------------------------------------------------------
detectors:
  onnx:
    type: onnx

# Modelo YOLOv9-t 320. O arquivo .onnx é gerado no servidor (veja o README:
# "Gerar o modelo YOLO pra GPU"). Sem ele, o Frigate não sobe a detecção.
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-t-320.onnx
  labelmap_path: /labelmap/coco-80.txt

ffmpeg:
  # DECODIFICAÇÃO na GPU (NVDEC) — tira o decode de vídeo da CPU.
  hwaccel_args: preset-nvidia
  output_args:
    # Grava em H.264 usando a GPU (h264_nvenc) — toca em qualquer browser.
    # A câmera envia H.265; a GPU converte pra H.264 na hora da gravação.
    record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v h264_nvenc -preset p4 -c:a aac

# -----------------------------------------------------------------------------
# go2rtc — reencaminha o stream da câmera (evita abrir 2 conexões na câmera:
# uma pra detecção e outra pra gravação). Recomendado.
# -----------------------------------------------------------------------------
go2rtc:
  streams:
    # Câmera CareCam "Loja" (192.168.15.12). Caminho RTSP descoberto via ONVIF.
    # Está com senha EM BRANCO (usuário admin, sem senha). Quando você colocar
    # uma senha na câmera, troque ":@" por ":{FRIGATE_RTSP_PASSWORD}" e preencha o .env.
    loja:                       # principal: 2304x1296, H.265  -> gravação
      - "rtsp://admin:@192.168.15.12:554/streamtype=0"
    loja_sub:                   # substream: 640x360, H.265     -> detecção (leve)
      - "rtsp://admin:@192.168.15.12:554/streamtype=1"
    loja_sub_h264:              # substream convertido p/ H.264  -> só pra ver AO VIVO
      # A câmera não deixa trocar p/ H.264. Como o Chrome/Edge não tocam H.265,
      # o go2rtc converte só o substream (640x360, leve na CPU) só pra exibição.
      - "ffmpeg:loja_sub#video=h264"

    # ---- Câmera "Loja 5" (192.168.15.13) — mesma CareCam, mesmo padrão ----
    loja5:
      - "rtsp://admin:@192.168.15.13:554/streamtype=0"
    loja5_sub:
      - "rtsp://admin:@192.168.15.13:554/streamtype=1"
    loja5_sub_h264:
      - "ffmpeg:loja5_sub#video=h264"

    # ---- Câmera "Loja 3" (192.168.15.5) — mesma CareCam, mesmo padrão ----
    loja_3:
      - rtsp://admin:@192.168.15.5:554/streamtype=0
    loja_3_sub:
      - rtsp://admin:@192.168.15.5:554/streamtype=1
    loja_3_sub_h264:
      - ffmpeg:loja_3_sub#video=h264

    # ---- Câmera "Loja 4" (192.168.15.10) — mesma CareCam, mesmo padrão ----
    loja_4:                     # chave com "_" -> a UI mostra "Loja 4"
      - rtsp://admin:@192.168.15.10:554/streamtype=0
    loja_4_sub:
      - rtsp://admin:@192.168.15.10:554/streamtype=1
    loja_4_sub_h264:
      - ffmpeg:loja_4_sub#video=h264

# -----------------------------------------------------------------------------
# Padrões aplicados a TODAS as câmeras (pode sobrescrever por câmera)
# -----------------------------------------------------------------------------
record:
  enabled: true
  alerts:
    retain:
      days: 14       # alertas (pessoa/carro): 14 dias
  detections:
    retain:
      days: 14       # demais detecções: 14 dias
  continuous:
    days: 0
  motion:
    days: 3          # gravação com movimento: 3 dias

snapshots:
  enabled: true
  retain:
    default: 14

objects:
  track:
    - person
    - car

# -----------------------------------------------------------------------------
# CÂMERAS
# -----------------------------------------------------------------------------
cameras:
  loja:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/loja_sub    # substream -> detecção
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/loja         # principal -> gravação
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 640      # resolução do substream (streamtype=1)
      height: 360
      fps: 5
    live:
      streams:
        loja_sub_h264: loja_sub_h264

  loja5:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/loja5_sub    # substream -> detecção
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/loja5         # principal -> gravação
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    live:
      streams:
        loja5_sub_h264: loja5_sub_h264

  loja_3:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/loja_3_sub   # substream -> detecção
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/loja_3        # principal -> gravação
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    live:
      streams:
        loja_3_sub_h264: loja_3_sub_h264

  loja_4:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/loja_4_sub   # substream -> detecção
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/loja_4        # principal -> gravação
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    live:
      streams:
        loja_4_sub_h264: loja_4_sub_h264

version: 0.18-0
