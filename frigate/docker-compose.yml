# =============================================================================
# Frigate NVR — STACK ISOLADA
# -----------------------------------------------------------------------------
# Esta stack roda de forma independente do restante do seu Docker.
# Suba/derrube SÓ o Frigate assim (de dentro da pasta frigate/):
#     docker compose up -d
#     docker compose down
#     docker compose logs -f
#
# Nada aqui interfere nos seus outros serviços (Open WebUI, Loja, etc.).
# Portas usadas aqui (8971 / 8554 / 8555) NÃO conflitam com as que você já usa.
# =============================================================================

name: frigate

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.14.1
    restart: unless-stopped

    # =========================================================================
    # TETO DE RECURSOS — VOCÊ decide o máximo. O container NUNCA passa disto.
    # -------------------------------------------------------------------------
    # mem_limit: se o Frigate tentar usar mais que isto, o Docker o segura
    #   (e mata/reinicia se estourar). É a garantia de que não vira "poço sem fundo".
    # Ajuste conforme o nº de câmeras (veja a tabela no README):
    #   1-2 câmeras -> 1.5g  |  3-4 câmeras -> 2g  |  mais -> aumente aos poucos.
    mem_limit: 2g
    mem_reservation: 512m     # memória "garantida" mínima
    cpus: 2.0                 # no máximo 2 núcleos de CPU (use 1.0 se quiser segurar mais)

    # shm = memória compartilhada dos frames das câmeras. NÃO é "extra" sem limite:
    # é um valor fixo. 128mb cobre 1-2 câmeras; 256mb cobre ~4 câmeras 1080p.
    shm_size: "128mb"

    # -------------------------------------------------------------------------
    # GPU Nvidia — DESATIVADA por padrão (recomendado no seu caso).
    # Sua GPU de 16GB "roda uma IA pesada por vez"; o Frigate roda 24/7, então
    # por padrão ele NÃO toca na GPU (detecção e decodificação na CPU).
    #
    # Descomente o bloco abaixo SÓ se quiser usar a GPU pra DECODIFICAR vídeo
    # (ainda assim, veja hwaccel_args no config.yml). Requer nvidia-container-toolkit.
    # -------------------------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    ports:
      - "8971:8971"       # Interface web COM login  ->  http://192.168.15.11:8971
      # - "5000:5000"     # Interface interna SEM login — NÃO exponha na rede
      - "8554:8554"       # RTSP restream (go2rtc)
      - "8555:8555/tcp"   # WebRTC (áudio/vídeo ao vivo, TCP)
      - "8555:8555/udp"   # WebRTC (áudio/vídeo ao vivo, UDP)

    volumes:
      - ./config:/config
      # Pasta de gravação. Vem da variável FRIGATE_STORAGE no .env.
      # Se não definir nada, usa ./storage (pasta local, boa pra TESTAR a interface).
      # Depois, pra gravar no NAS, é só definir FRIGATE_STORAGE=/mnt/nas/frigate no .env.
      - ${FRIGATE_STORAGE:-./storage}:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      # Cache em RAM pros trechos de gravação (antes de irem pro NAS).
      # ISTO é RAM. Estava em 1 GB (exagerado) — reduzi pra 256 MB, que basta
      # pra poucas câmeras. Só aumente se aparecer erro de "cache cheio" no log.
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 268435456   # 256 MB

    env_file:
      - .env
